# ==============================================================================
# CONLAC-T - Spring Boot Test Profile (Entorno de Pruebas Hermético)
# ==============================================================================
spring.application.name=conlact-backend-test

# JPA / Hibernate para Pruebas de Integración (Valida contra schema.sql ejecutado en Testcontainers)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración de Supabase Auth / JWT (Aislada y sin dependencias externas para testing)
app.supabase.url=https://mock-project.supabase.co
app.supabase.jwt.secret=test-secret-jwt-token-with-at-least-32-characters-length-for-testing
app.supabase.jwt.issuer=https://mock-project.supabase.co/auth/v1
app.supabase.jwt.public-key=
app.supabase.service-role-key=test-service-role-key-for-admin-operations

# Buckets de Storage para Pruebas
app.supabase.storage.product-bucket=product-images
app.supabase.storage.recipe-bucket=recipe-images
app.supabase.storage.payment-bucket=payment-proofs

# CORS de Pruebas
cors.allowed-origins=http://localhost:3000,http://localhost:5173
