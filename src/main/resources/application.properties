spring.application.name=conlact-backend
spring.profiles.active=local
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-float-as-int=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Supabase Auth / JWT Configuration
app.supabase.url=${SUPABASE_URL:http://localhost:54321}
app.supabase.anon-key=${SUPABASE_ANON_KEY:}
app.supabase.jwt.public-key=${SUPABASE_JWT_PUBLIC_KEY:}
app.supabase.jwt.secret=${SUPABASE_JWT_SECRET:super-secret-jwt-token-with-at-least-32-characters-length}
app.supabase.jwt.issuer=${SUPABASE_JWT_ISSUER:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:super-secret-service-role-key-for-admin-operations}

# Supabase Storage Buckets
app.supabase.storage.product-bucket=${STORAGE_PRODUCT_BUCKET:product-images}
app.supabase.storage.recipe-bucket=${STORAGE_RECIPE_BUCKET:recipe-images}
app.supabase.storage.payment-bucket=${STORAGE_PAYMENT_BUCKET:payment-proofs}

# SMTP: deshabilitado hasta configurar un proveedor. No se conecta durante el arranque.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@conlact.local}
app.mail.sender-name=${MAIL_FROM_NAME:CONLAC-T}
app.mail.admin-recipient=${MAIL_ADMIN_RECIPIENT:${MAIL_FROM:no-reply@conlact.local}}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# Actuator & Health Monitoring (BE-39)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=true

info.app.name=CONLAC-T Backend API
info.app.description=API Backend Consorcio de Lácteos Tungurahua
info.app.version=1.0.0-RC

# Directorio de respaldos y política de retención (días)
app.backup.directory=${BACKUP_DIRECTORY:./docker/backups}
app.backup.retention-days=${BACKUP_RETENTION_DAYS:7}
