services:
  postgres:
    image: postgres:16-alpine
    container_name: conlact-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: conlact_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - pgdata-conlact:/var/lib/postgresql/data

volumes:
  pgdata-conlact: